services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/platform.db
    volumes:
      - platform-data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  platform-data:
